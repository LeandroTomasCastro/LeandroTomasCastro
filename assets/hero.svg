<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Leandro Tomás Castro, Full Stack Developer, construyendo SaikoTech">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#22D3EE" stop-opacity=".22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7DD3FC" stroke-opacity=".08"/></pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
  <style>
    .cursor{animation:blink 1.1s steps(1) infinite}
    .pulse{animation:pulse 2.2s ease-in-out infinite}
    .orbit{animation:orbit 14s linear infinite;transform-origin:995px 177px}
    @keyframes blink{50%{opacity:0}}
    @keyframes pulse{50%{opacity:.3}}
    @keyframes orbit{to{transform:rotate(360deg)}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#080D1C"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="980" cy="170" r="360" fill="url(#halo)"/>
    <circle class="orbit" cx="995" cy="177" r="160" fill="none" stroke="#A78BFA" stroke-opacity=".22" stroke-dasharray="5 12"/>
    <path d="M0 2H1200" stroke="url(#accent)" stroke-width="4"/>
    <path d="M0 358H1200" stroke="url(#accent)" stroke-width="3"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="58" y="66" font-size="16" font-weight="700" letter-spacing="3" fill="#22D3EE">SAIKOTECH / DEV PROFILE</text>
      <text x="54" y="157" font-size="82" font-weight="800" letter-spacing="-2" fill="#F8FAFC">LEANDRO</text>
      <text x="58" y="221" font-size="56" font-weight="800" letter-spacing="-1" fill="url(#accent)">TOMÁS CASTRO</text>
      <text x="60" y="266" font-size="21" fill="#CBD5E1">Full Stack Developer · Argentina</text>
      <rect x="59" y="291" width="256" height="38" rx="19" fill="#111D34" stroke="#22D3EE" stroke-opacity=".65"/>
      <circle class="pulse" cx="80" cy="310" r="6" fill="#22D3EE"/>
      <text x="98" y="316" font-size="14" font-weight="700" letter-spacing="1" fill="#E2E8F0">CREANDO SAIKOPOS</text>
    </g>
    <g transform="translate(690 66)" font-family="Consolas, 'Courier New', monospace">
      <rect width="462" height="245" rx="14" fill="#0D172B" stroke="#A78BFA" stroke-opacity=".55"/>
      <path d="M0 38H462" stroke="#334155"/>
      <circle cx="22" cy="19" r="5" fill="#FB7185"/><circle cx="41" cy="19" r="5" fill="#FBBF24"/><circle cx="60" cy="19" r="5" fill="#34D399"/>
      <text x="231" y="24" text-anchor="middle" font-size="12" fill="#94A3B8">saikotech@dev:~</text>
      <text x="25" y="78" font-size="16" fill="#22D3EE">$ whoami</text>
      <text x="25" y="106" font-size="16" fill="#E2E8F0">Leandro Tomás Castro</text>
      <text x="25" y="146" font-size="16" fill="#22D3EE">$ focus</text>
      <text x="25" y="174" font-size="16" fill="#E2E8F0">software para negocios reales</text>
      <text x="25" y="214" font-size="16" fill="#22D3EE">$ build saikopos<tspan class="cursor" fill="#A78BFA"> ▌</tspan></text>
    </g>
  </g>
</svg>
