<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="SaikoTech.DEV — Leandro Tomás Castro, Full Stack Developer">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7C3AED"/><stop offset=".55" stop-color="#A855F7"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#A855F7" stop-opacity=".24"/><stop offset="1" stop-color="#A855F7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#C084FC" stroke-opacity=".055"/></pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <style>.pulse{animation:p 2.4s ease-in-out infinite}.cursor{animation:b 1.1s steps(1) infinite}@keyframes p{50%{opacity:.3}}@keyframes b{50%{opacity:0}}</style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="#0B0714"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="980" cy="165" r="370" fill="url(#glow)"/>
    <path d="M0 3H1200" stroke="url(#accent)" stroke-width="6"/>
    <path d="M0 357H1200" stroke="url(#accent)" stroke-opacity=".65" stroke-width="3"/>
    <g font-family="Arial, Helvetica, sans-serif">
      <text x="58" y="65" font-size="17" font-weight="700" letter-spacing="4" fill="#C084FC">SAIKOTECH.DEV</text>
      <text x="58" y="94" font-size="15" font-weight="600" letter-spacing="3" fill="#A1A1AA">SOFTWARE · WEB · IT</text>
      <text x="54" y="178" font-size="74" font-weight="800" letter-spacing="-2" fill="#F8FAFC">LEANDRO</text>
      <text x="56" y="238" font-size="51" font-weight="800" fill="url(#accent)">TOMÁS CASTRO</text>
      <text x="59" y="282" font-size="20" fill="#F8FAFC">Full Stack Developer / Software Developer</text>
      <rect x="58" y="305" width="248" height="34" rx="17" fill="#151022" stroke="#A855F7" stroke-opacity=".7"/>
      <circle class="pulse" cx="76" cy="322" r="5" fill="#C084FC"/>
      <text x="91" y="328" font-size="13" font-weight="700" letter-spacing="1" fill="#F8FAFC">BUILDING SAIKOTECH.DEV</text>
    </g>
    <g transform="translate(708 64)" font-family="Consolas, 'Courier New', monospace">
      <rect width="442" height="236" rx="15" fill="#151022" stroke="#A855F7" stroke-opacity=".55"/>
      <path d="M0 38H442" stroke="#312344"/>
      <circle cx="22" cy="19" r="5" fill="#A855F7"/><circle cx="41" cy="19" r="5" fill="#7C3AED"/><circle cx="60" cy="19" r="5" fill="#C084FC"/>
      <text x="221" y="24" text-anchor="middle" font-size="12" fill="#A1A1AA">leandro@saikotech:~</text>
      <text x="25" y="78" font-size="16" fill="#C084FC">$ whoami</text>
      <text x="25" y="106" font-size="16" fill="#F8FAFC">Full Stack Developer</text>
      <text x="25" y="145" font-size="16" fill="#C084FC">$ mission</text>
      <text x="25" y="173" font-size="16" fill="#F8FAFC">crear software que resuelve</text>
      <text x="25" y="211" font-size="16" fill="#A855F7">$ build saikotech.dev<tspan class="cursor" fill="#C084FC"> ▌</tspan></text>
    </g>
  </g>
</svg>

